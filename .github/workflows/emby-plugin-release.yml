name: Emby plugin release

# Manually publishes a GitHub Release for the Emby plugin:
#   - version comes from <Version> in emby-plugin/ClearFrame/ClearFrame.csproj
#   - release notes come from that version's "## x.y.z" section in emby-plugin/CHANGELOG.md
#   - ClearFrame.dll is built by the regular "Emby plugin" workflow and attached
# Tag: emby-plugin-v<version>. Bump <Version> and add a CHANGELOG section before running.

on:
  workflow_dispatch:
    inputs:
      emby_version:
        description: 'Emby Server version the released DLL is compiled against'
        required: false
        default: '4.10.2.0'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: emby-plugin-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' emby-plugin/ClearFrame/ClearFrame.csproj | head -n1)
          if [ -z "$version" ]; then
            echo "::error file=emby-plugin/ClearFrame/ClearFrame.csproj::No <Version> found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=emby-plugin-v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing ClearFrame Emby plugin $version"

      - name: Check the tag is new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump <Version> in ClearFrame.csproj and add a CHANGELOG section first."
            exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' emby-plugin/CHANGELOG.md > notes.md || {
            echo "::error file=emby-plugin/CHANGELOG.md::No '## $VERSION' section found"
            exit 1
          }
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=emby-plugin/CHANGELOG.md::The '## $VERSION' section is empty"
            exit 1
          fi
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/emby-plugin.yml
    with:
      emby_version: ${{ inputs.emby_version }}

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClearFrame-emby-${{ inputs.emby_version }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EMBY: ${{ inputs.emby_version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          test -s dist/ClearFrame.dll
          {
            cat notes.md
            echo
            echo "---"
            echo "Built against Emby Server $EMBY. Copy \`ClearFrame.dll\` into your Emby \`plugins\` folder and restart Emby."
          } > body.md

          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ClearFrame Emby plugin $VERSION" --notes-file body.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/ClearFrame.dll "${args[@]}"
          echo "Published $TAG"
